name: CI

# The console's web app: type-checked, built and tested on every push. It isn't published on its own: Winche Server
# embeds a build of it (scripts/update-console-web.sh there).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
